name: Build
on:
  push:
    branches:
      - main
      - ci/*

jobs:
  build:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: echo rust version
        run: rustc --version
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache LLVM and Clang
        id: cache-llvm
        uses: actions/cache@v5
        with:
          path: |
            ./llvm
          key: ${{ runner.os }}-llvm-14
      - name: Cache build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: |
            wiz/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.toml') }}
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "14.0"
          cached: ${{ steps.cache-llvm.outputs.cache-hit }}
        if: runner.os != 'Windows'
      - name: Install LLVM and Clang
        run: |
          if [ ! -d "$FILE" ]; then
            echo "$LLVM_DOWNLOAD_URL"
            curl -L "$LLVM_DOWNLOAD_URL" --output ./llvm.zip
            unzip -o ./llvm.zip -d ./llvm
          fi
        shell: bash
        env:
          LLVM_DOWNLOAD_URL: "https://github.com/wiz-language/llvm-project/releases/download/llvmorg-14.0.6/llvm-project-14.0.6-windows-binary.zip"
          FILE: ./llvm
        if: runner.os == 'Windows'
      - name: Set Path of LLVM and Clang
        run: |
          llvm_config="$(find "$PWD" -path '*bin/llvm-config.exe' -print -quit)"
          llvm_prefix="$(dirname "$(dirname "$llvm_config")")"
          echo "LLVM_SYS_140_PREFIX=$llvm_prefix"
          echo "LLVM_SYS_140_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
        shell: bash
        if: runner.os == 'Windows'
      - name: run build
        run: cargo build --manifest-path wiz/Cargo.toml --release
        shell: bash
        env:
          RUST_BACKTRACE: 1
      - name: create archive
        run: |
          tar cvzf wiz-${{ runner.os }}.tar.gz ./install.sh ./env ./wiz/target/release/wiz ./wiz/target/release/wizc ./libraries
        if: runner.os != 'Windows'
      - name: create archive
        run: |
          tar cvzf wiz-${{ runner.os }}.tar.gz ./install.sh ./env ./wiz/target/release/wiz.exe ./wiz/target/release/wizc.exe ./libraries
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v5
        with:
          name: wiz-${{ runner.os }}
          path: |
            wiz-${{ runner.os }}.tar.gz

  pre_release:
    needs:
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: dev-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: download archives
        uses: actions/download-artifact@v5
        with:
          path: ~/artifact/
      - name: ls
        run: |
          ls ~/artifact/
      - name: recreate dev-latest release
        run: |
          gh release delete dev-latest --cleanup-tag --yes || true
          git push --delete origin dev-latest || true
          gh release create dev-latest ~/artifact/*/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "dev-latest" \
            --prerelease \
            --latest=false \
            --notes "Automated development build for $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
